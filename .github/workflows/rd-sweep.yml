name: Glicko-2 Sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      year:
        description: "Dataset year (e.g. 2015, 2025)"
        required: true
        default: "2015"
      months:
        description: "Space-separated months to stitch (e.g. 01 02 03)"
        required: true
        default: "01 02 03"
      speeds:
        description: 'JSON array of speeds to run in parallel (e.g. ["Bullet", "Blitz", "Rapid", "Classical"])'
        required: true
        default: '["Bullet", "Blitz", "Rapid", "Classical"]'
      warmup_days:
        description: "Optional warmup days (blank = default count warmup)"
        required: false
        default: ""

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      year: ${{ github.event_name == 'workflow_dispatch' && inputs.year || '2015' }}
      months: ${{ github.event_name == 'workflow_dispatch' && inputs.months || '01 02 03' }}
      speeds: ${{ github.event_name == 'workflow_dispatch' && inputs.speeds || '["Bullet", "Blitz", "Rapid", "Classical"]' }}
      warmup_days: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup_days || '' }}
    steps:
      - run: echo "Configured ${{ github.event_name }} sweep"

  sweep:
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        speed: ${{ fromJson(needs.configure.outputs.speeds) }}

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YEAR: ${{ needs.configure.outputs.year }}
      MONTHS: ${{ needs.configure.outputs.months }}
      SPEED: ${{ matrix.speed }}
      WARMUP_DAYS: ${{ needs.configure.outputs.warmup_days }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stitched Glicko-2 sweep (${{ matrix.speed }})
        run: |
          ARGS="--year $YEAR --months $MONTHS --speed $SPEED"
          if [ -n "$WARMUP_DAYS" ]; then
            ARGS="$ARGS --warmup-days $WARMUP_DAYS"
          fi
          python3 batch_sweep.py $ARGS

      - name: Upload sweep CSV artifact
        uses: actions/upload-artifact@v6
        with:
          name: sweep-${{ env.YEAR }}-${{ env.SPEED }}
          path: "*_sweep.csv"

