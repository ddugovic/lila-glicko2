name: Glicko-2 Sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: "Space-separated categories or 'all'"
        required: true
        default: "all"
      partitions:
        description: "Years, months, or ranges (e.g. 2013..2016, 2013 2014, or 2018-01..2018-06)"
        required: true
        default: "2013..2015"
      warmup_days:
        description: "Optional warmup days (blank = default count warmup)"
        required: false
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.category || 'all' }}
      PARTITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '2013..2015' }}
      WARMUP_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup_days || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Glicko-2 sweep
        run: |
          WARMUP_ARG=""
          if [ -n "$WARMUP_DAYS" ]; then
            WARMUP_ARG="--warmup-days $WARMUP_DAYS"
          fi
          python3 batch_sweep.py --category $CATEGORY --partitions $PARTITIONS $WARMUP_ARG

      - name: Upload sweep CSV artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sweep-results
          path: "*_sweep.csv"

