name: Glicko-2 Sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: "Space-separated categories or 'all' (bullet blitz rapid classical antichess atomic chess960 crazyhouse horde king-of-the-hill racing-kings three-check)"
        required: true
        default: "all"
      partitions:
        description: "Space-separated YYYY or YYYY-MM partitions (e.g. 2013-01 or 2015 2016)"
        required: true
        default: "2013"
      warmup_days:
        description: "Optional warmup days (blank = default count warmup)"
        required: false
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.category || 'all' }}
      PARTITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '2013' }}
      WARMUP_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup_days || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Glicko-2 sweep
        run: |
          WARMUP_ARG=""
          if [ -n "$WARMUP_DAYS" ]; then
            WARMUP_ARG="--warmup-days $WARMUP_DAYS"
          fi
          python3 batch_sweep.py --category $CATEGORY --partitions $PARTITIONS $WARMUP_ARG

      - name: Upload sweep CSV artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sweep-results
          path: "*_sweep.csv"

