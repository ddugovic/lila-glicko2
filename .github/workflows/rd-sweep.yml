name: Glicko-2 Sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repo:
        description: "Hugging Face dataset repo ID"
        required: true
        default: "Lichess/standard-chess-games"
      year:
        description: "Dataset year (e.g. 2015, 2025)"
        required: true
        default: "2015"
      months:
        description: "Space-separated months to stitch (e.g. 01 02 03)"
        required: true
        default: "01"
      speed:
        description: "Space-separated speeds (e.g. Bullet Blitz Rapid Classical — leave blank for variants)"
        required: false
        default: "Bullet Blitz Rapid Classical"
      warmup_days:
        description: "Optional warmup days (blank = default count warmup)"
        required: false
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.repo || 'Lichess/standard-chess-games' }}
      YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.year || '2015' }}
      MONTHS: ${{ github.event_name == 'workflow_dispatch' && inputs.months || '01' }}
      SPEED: ${{ github.event_name == 'workflow_dispatch' && inputs.speed || 'Bullet Blitz Rapid Classical' }}
      WARMUP_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup_days || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Glicko-2 sweep
        run: |
          WARMUP_ARG=""
          if [ -n "$WARMUP_DAYS" ]; then
            WARMUP_ARG="--warmup-days $WARMUP_DAYS"
          fi

          if [ -z "$SPEED" ]; then
            # Variant dataset (no speed filter)
            python3 batch_sweep.py --repo "$REPO" --year "$YEAR" --months $MONTHS $WARMUP_ARG
          else
            # Standard chess: run each speed pool sequentially (reusing cached HF shards on disk)
            for S in $SPEED; do
              python3 batch_sweep.py --repo "$REPO" --year "$YEAR" --months $MONTHS --speed "$S" $WARMUP_ARG
            done
          fi

      - name: Upload sweep CSV artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sweep-${{ env.YEAR }}
          path: "*_sweep.csv"

