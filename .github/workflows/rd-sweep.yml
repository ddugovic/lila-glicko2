name: Glicko-2 Sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repo:
        description: "Hugging Face dataset repo ID"
        required: true
        default: "Lichess/standard-chess-games"
      partitions:
        description: "Space-separated YYYY or YYYY-MM partitions (e.g. 2013-01 or 2015 2016)"
        required: true
        default: "2013"
      speed:
        description: "Space-separated speeds (e.g. Bullet Blitz Rapid Classical — leave blank for variants)"
        required: false
        default: "Bullet Blitz Rapid Classical"
      warmup_days:
        description: "Optional warmup days (blank = default count warmup)"
        required: false
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.repo || 'Lichess/standard-chess-games' }}
      PARTITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '2013' }}
      SPEED: ${{ github.event_name == 'workflow_dispatch' && inputs.speed || 'Bullet Blitz Rapid Classical' }}
      WARMUP_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup_days || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Glicko-2 sweep
        run: |
          WARMUP_ARG=""
          if [ -n "$WARMUP_DAYS" ]; then
            WARMUP_ARG="--warmup-days $WARMUP_DAYS"
          fi

          if [ -z "$SPEED" ]; then
            python3 batch_sweep.py --repo "$REPO" --partitions $PARTITIONS $WARMUP_ARG
          else
            for S in $SPEED; do
              python3 batch_sweep.py --repo "$REPO" --partitions $PARTITIONS --speed "$S" $WARMUP_ARG
            done
          fi

      - name: Upload sweep CSV artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sweep-results
          path: "*_sweep.csv"

