name: Glicko-2 Sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: "Game category (standard, variants, all, or a single variant)"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - standard
          - variants
          - antichess
          - atomic
          - chess960
          - crazyhouse
          - horde
          - king-of-the-hill
          - racing-kings
          - three-check
      speed:
        description: "Speed filter (use 'none' for unsplit real-time variants, 'all' for all speeds)"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - none
          - bullet
          - blitz
          - rapid
          - classical
          - correspondence
      partitions:
        description: "Years, months, or ranges (e.g. 2013..2016, 2024, or 2025-01..2025-06)"
        type: string
        required: true
        default: "2013"
      warmup_days:
        description: "Optional warmup days (blank = default 10% up to 500k games)"
        type: string
        required: false
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.category || 'standard' }}
      SPEED: ${{ github.event_name == 'workflow_dispatch' && inputs.speed || 'classical' }}
      PARTITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '2013' }}
      WARMUP_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup_days || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Glicko-2 sweep
        run: |
          echo "Category: $CATEGORY | Speed: $SPEED | Partitions: $PARTITIONS | Warmup: ${WARMUP_DAYS:-default}"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "**Run Config:** category=\`$CATEGORY\`, speed=\`$SPEED\`, partitions=\`$PARTITIONS\`, warmup=\`${WARMUP_DAYS:-default}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          WARMUP_ARG=""
          if [ -n "$WARMUP_DAYS" ]; then
            WARMUP_ARG="--warmup-days $WARMUP_DAYS"
          fi
          python3 batch_sweep.py --category $CATEGORY --speed $SPEED --partitions $PARTITIONS $WARMUP_ARG

      - name: Upload sweep CSV artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sweep-results
          path: "*_sweep.csv"

