name: Glicko-2 Sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: "Game category (standard, variants, all, or a single variant)"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - standard
          - variants
          - antichess
          - atomic
          - chess960
          - crazyhouse
          - horde
          - king-of-the-hill
          - racing-kings
          - three-check
      speed:
        description: "Speed filter (use 'realtime' for unsplit real-time variants, 'all' for all speeds)"
        type: choice
        required: true
        default: "realtime"
        options:
          - realtime
          - all
          - bullet
          - blitz
          - rapid
          - classical
          - correspondence
      partitions:
        description: "Years, months, or ranges (e.g. 2013..2016, 2024, or 2025-01..2025-06)"
        type: string
        required: true
        default: "2013"
      warmup_days:
        description: "Optional warmup days (blank = default 10% up to 500k games)"
        type: string
        required: false
        default: ""

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTHONUNBUFFERED: "1"
  CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.category || 'all' }}
  SPEED: ${{ github.event_name == 'workflow_dispatch' && inputs.speed || 'all' }}
  PARTITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '2013' }}
  WARMUP_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup_days || '' }}

jobs:
  sweep-standard:
    if: ${{ (github.event.inputs.category || 'all') == 'all' || (github.event.inputs.category || 'all') == 'standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - run: pip install -r requirements.txt
      - name: Run standard sweep
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "**Run Config (Standard):** speed=\`$SPEED\`, partitions=\`$PARTITIONS\`, warmup=\`${WARMUP_DAYS:-default}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          WARMUP_ARG=""
          [ -n "$WARMUP_DAYS" ] && WARMUP_ARG="--warmup-days $WARMUP_DAYS"
          python3 batch_sweep.py --category standard --speed $SPEED --partitions $PARTITIONS $WARMUP_ARG
      - name: Upload standard CSVs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sweep-results-standard
          path: "*_sweep.csv"

  sweep-variant:
    if: ${{ (github.event.inputs.category || 'all') != 'standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant:
          - antichess
          - atomic
          - chess960
          - crazyhouse
          - horde
          - king-of-the-hill
          - racing-kings
          - three-check
    steps:
      - name: Check if matrix variant is selected
        id: filter
        run: |
          if [ "$CATEGORY" = "all" ] || [ "$CATEGORY" = "variants" ] || [ "$CATEGORY" = "${{ matrix.variant }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.filter.outputs.run == 'true'
      - uses: actions/setup-python@v6
        if: steps.filter.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - if: steps.filter.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Run ${{ matrix.variant }} sweep
        if: steps.filter.outputs.run == 'true'
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "**Run Config (${{ matrix.variant }}):** speed=\`$SPEED\`, partitions=\`$PARTITIONS\`, warmup=\`${WARMUP_DAYS:-default}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          WARMUP_ARG=""
          [ -n "$WARMUP_DAYS" ] && WARMUP_ARG="--warmup-days $WARMUP_DAYS"
          python3 batch_sweep.py --category ${{ matrix.variant }} --speed $SPEED --partitions $PARTITIONS $WARMUP_ARG
      - name: Upload ${{ matrix.variant }} CSVs
        if: always() && steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sweep-results-${{ matrix.variant }}
          path: "*_sweep.csv"

  summarize:
    if: always()
    needs: [sweep-standard, sweep-variant]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - run: pip install -r requirements.txt
      - name: Download all sweep CSV artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: sweep-results-*
          path: artifacts
      - name: Render combined top-level summary
        run: python3 summarize_results.py

